<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0a1f10"/>
      <stop offset="45%"  stop-color="#163a20"/>
      <stop offset="100%" stop-color="#1e5430"/>
    </linearGradient>
    <radialGradient id="topshine" cx="50%" cy="0%" r="60%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Bubble fill -->
    <linearGradient id="bubble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#f8fdfb"/>
      <stop offset="100%" stop-color="#e8f5ee"/>
    </linearGradient>
    <radialGradient id="goldDot" cx="40%" cy="35%" r="55%">
      <stop offset="0%"   stop-color="#f5d98a"/>
      <stop offset="60%"  stop-color="#d4a237"/>
      <stop offset="100%" stop-color="#b07820"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#topshine)"/>
  <rect width="512" height="512" rx="116" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>

  <!-- Chat bubble rounded rect -->
  <rect x="110" y="128" width="292" height="210" rx="40" fill="url(#bubble)"/>
  <!-- Bubble tail (bottom left) -->
  <path d="M152 338 L130 394 L200 338 Z" fill="url(#bubble)"/>
  <!-- Bubble inner shine -->
  <rect x="110" y="128" width="292" height="90" rx="40" fill="rgba(255,255,255,0.30)"/>

  <!-- "AB" text -->
  <text x="256" y="245" text-anchor="middle" dominant-baseline="middle"
        font-size="100" font-family="Arial Black, Arial, sans-serif" font-weight="900"
        fill="#163a20" letter-spacing="-3">AB</text>

  <!-- Gold dot top-right -->
  <circle cx="374" cy="138" r="38" fill="#0a1f10"/>
  <circle cx="374" cy="138" r="32" fill="url(#goldDot)"/>
  <circle cx="362" cy="126" r="9" fill="rgba(255,255,255,0.35)"/>
</svg>
