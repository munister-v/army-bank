<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background gradient: deep military green -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0a1f10"/>
      <stop offset="45%"  stop-color="#163a20"/>
      <stop offset="100%" stop-color="#1e5430"/>
    </linearGradient>
    <!-- Inner top highlight -->
    <radialGradient id="topshine" cx="50%" cy="0%" r="60%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Shield gradient -->
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="10%" y2="100%">
      <stop offset="0%"   stop-color="#f0f8f3"/>
      <stop offset="100%" stop-color="#d8eee2"/>
    </linearGradient>
    <!-- Shield inner shadow -->
    <linearGradient id="shieldShad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#1a5c3a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d3320" stop-opacity="0.18"/>
    </linearGradient>
    <!-- Gold dot -->
    <radialGradient id="goldDot" cx="40%" cy="35%" r="55%">
      <stop offset="0%"   stop-color="#f5d98a"/>
      <stop offset="60%"  stop-color="#d4a237"/>
      <stop offset="100%" stop-color="#b07820"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- Top shine -->
  <rect width="512" height="512" rx="116" fill="url(#topshine)"/>
  <!-- Subtle bottom vignette -->
  <rect y="256" width="512" height="256" rx="0" fill="#000000" opacity="0.08"/>
  <rect width="512" height="512" rx="116" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>

  <!-- Shield body — modern clean shape -->
  <path d="M256 104 L362 150 L362 270 Q362 358 256 400 Q150 358 150 270 L150 150 Z"
        fill="url(#shieldFill)"/>
  <path d="M256 104 L362 150 L362 270 Q362 358 256 400 Q150 358 150 270 L150 150 Z"
        fill="url(#shieldShad)"/>

  <!-- Shield inner highlight line -->
  <path d="M256 116 L350 158 L350 268 Q350 348 256 388"
        fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- "AB" lettering -->
  <text x="256" y="278" text-anchor="middle" dominant-baseline="middle"
        font-size="106" font-family="Arial Black, Arial, sans-serif" font-weight="900"
        fill="#163a20" letter-spacing="-4">AB</text>

  <!-- Gold notification dot -->
  <circle cx="374" cy="138" r="38" fill="#0a1f10"/>
  <circle cx="374" cy="138" r="32" fill="url(#goldDot)"/>
  <circle cx="362" cy="126" r="9" fill="rgba(255,255,255,0.35)"/>
</svg>
