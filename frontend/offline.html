<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#162c5c">
  <title>Army Bank — Офлайн</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1e3d;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px env(safe-area-inset-right, 24px) calc(24px + env(safe-area-inset-bottom, 0px)) env(safe-area-inset-left, 24px);
    }
    .card {
      max-width: 340px;
      width: 100%;
    }
    .logo {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -.02em;
      margin-bottom: 32px;
      color: #fff;
    }
    .logo span { color: #6ba3f7; }
    .icon {
      width: 72px;
      height: 72px;
      background: rgba(255,255,255,.07);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #f1f5f9;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    button {
      background: #1a56db;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background .15s;
    }
    button:hover { background: #1648c0; }
    .hint {
      font-size: 12px;
      color: #475569;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Army<span>Bank</span></div>
    <div class="icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#6ba3f7" stroke-width="1.8" stroke-linecap="round">
        <line x1="1" y1="1" x2="23" y2="23"/>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
    </div>
    <h1>Немає підключення</h1>
    <p>Схоже, ви офлайн. Перевірте з'єднання з інтернетом і спробуйте ще раз.</p>
    <button onclick="location.reload()">Спробувати знову</button>
    <p class="hint">Деякі розділи можуть бути доступні з кешу</p>
  </div>
</body>
</html>
