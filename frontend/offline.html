<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f3b2d">
  <title>Army Bank — Офлайн</title>
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg?v=2026-04-09-01">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png?v=2026-04-09-01">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png?v=2026-04-09-01">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: radial-gradient(circle at 20% 10%, rgba(31,107,76,.18), transparent 40%), #0d1e15;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px env(safe-area-inset-right, 24px) calc(24px + env(safe-area-inset-bottom, 0px)) env(safe-area-inset-left, 24px);
    }
    .card {
      max-width: 340px;
      width: 100%;
    }
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -.02em;
      margin-bottom: 32px;
      color: #fff;
    }
    .logo img {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: block;
      box-shadow: 0 8px 20px rgba(0,0,0,.3);
    }
    .logo span { color: #d0ab62; }
    .icon {
      width: 72px;
      height: 72px;
      background: rgba(255,255,255,.08);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    .icon img {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: block;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #f1f5f9;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    button {
      background: #1f6b4c;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background .15s;
    }
    button:hover { background: #18553d; }
    .hint {
      font-size: 12px;
      color: #475569;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><img src="/icons/icon-96.png" alt="" width="34" height="34" loading="eager" decoding="async">Army<span>Bank</span></div>
    <div class="icon">
      <img src="/icons/icon-96.png" alt="" width="40" height="40" loading="eager" decoding="async">
    </div>
    <h1>Немає підключення</h1>
    <p>Схоже, ви офлайн. Перевірте з'єднання з інтернетом і спробуйте ще раз.</p>
    <button onclick="location.reload()">Спробувати знову</button>
    <p class="hint">Деякі розділи можуть бути доступні з кешу</p>
  </div>
</body>
</html>
