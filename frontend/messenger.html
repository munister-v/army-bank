<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#f0f4fc"/>
  <meta name="description" content="Army Bank — Захищений месенджер"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="AB Chat"/>
  <title>Army Bank · Месенджер</title>
  <link rel="manifest" href="/manifest-messenger.json"/>
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg"/>
  <link rel="apple-touch-icon" href="/icons/icon-192.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/messenger.css"/>
</head>
<body>

<!-- ════════════════════════════════════════════
     AUTH SCREEN — split layout (ref: Nummus Bank)
════════════════════════════════════════════ -->
<div id="auth-screen" class="auth-screen">
  <!-- Left: login form -->
  <div class="auth-form-panel">
    <div class="auth-form-inner">
      <h1 class="auth-form-title">Вхід</h1>

      <form id="login-form" novalidate>
        <div class="field-group">
          <label class="field-label" for="auth-identity">Телефон або Email</label>
          <input id="auth-identity" class="field-input" type="text"
                 placeholder="+380XXXXXXXXX або email@domain.com"
                 autocomplete="username" inputmode="email" required/>
        </div>
        <div class="field-group">
          <label class="field-label" for="auth-password">Пароль</label>
          <div class="field-password-wrap">
            <input id="auth-password" class="field-input" type="password"
                   placeholder="Ваш пароль"
                   autocomplete="current-password" required/>
            <button type="button" class="btn-eye" id="btn-toggle-pw" aria-label="Показати пароль">
              <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="20" height="20">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div id="auth-error" class="auth-error" hidden></div>

        <button type="submit" class="btn-primary" id="btn-login">
          <span id="btn-login-text">Увійти</span>
          <span id="btn-login-spin" class="spinner" hidden></span>
        </button>
      </form>

      <p class="auth-hint">Використовуйте дані від Army Bank.</p>
    </div>
  </div>

  <!-- Right: branded gradient panel -->
  <div class="auth-brand-panel">
    <div class="auth-brand-logo">AB</div>
    <div class="auth-brand-name">Army Bank</div>
  </div>
</div>

<!-- ════════════════════════════════════════════
     MAIN APP
════════════════════════════════════════════ -->
<div id="app" class="app" hidden>

  <!-- SIDEBAR: conversation list -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-header-left">
        <div class="sidebar-logo-icon">AB</div>
        <span class="sidebar-title">Чати</span>
      </div>
      <div class="sidebar-header-right">
        <button class="icon-btn" id="btn-new-chat" title="Новий чат">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="sidebar-search">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input id="conv-search" class="search-input" type="text" placeholder="Пошук розмов..."/>
    </div>

    <div class="conv-list" id="conv-list">
      <div class="conv-empty" id="conv-empty" hidden>
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" width="48" height="48">
          <path d="M24 4C13 4 4 12.5 4 23c0 5.5 2.4 10.4 6.2 13.8L8 44l8.5-2.7C19.1 42.4 21.5 43 24 43c11 0 20-8.5 20-20S35 4 24 4z" stroke="#a0a5bd" stroke-width="1.5" fill="none"/>
        </svg>
        <p>Немає розмов.<br/>Натисніть + щоб почати чат.</p>
      </div>
    </div>
  </aside>

  <!-- CHAT AREA -->
  <main class="chat-area" id="chat-area">

    <!-- Top bar (ref: white bar with section name + avatar) -->
    <div class="chat-topbar" id="chat-topbar">
      <div class="chat-topbar-section">Месенджер</div>
      <div class="chat-topbar-right">
        <button class="topbar-bell" id="btn-unread" title="Непрочитані">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="18" height="18">
            <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 01-3.46 0"/>
          </svg>
          <span class="badge" id="unread-badge" hidden></span>
        </button>
        <div class="topbar-avatar" id="topbar-avatar"></div>
        <button class="icon-btn" id="btn-logout" title="Вийти">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="18" height="18">
            <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
            <polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Empty state (no chat selected) -->
    <div class="chat-empty" id="chat-empty">
      <div class="chat-empty-icon">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" width="64" height="64">
          <path d="M32 6C17.6 6 6 16.7 6 30c0 7.3 3.3 13.9 8.5 18.4L12 58l11.5-3.6C26.3 55.4 29.1 56 32 56c14.4 0 26-10.7 26-24S46.4 6 32 6z" stroke="#a0a5bd" stroke-width="2" fill="rgba(74,124,250,.04)"/>
          <path d="M22 30h20M22 22h14" stroke="#a0a5bd" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <p class="chat-empty-title">Оберіть розмову</p>
      <p class="chat-empty-sub">або натисніть <strong>+</strong> щоб написати комусь</p>
    </div>

    <!-- Active chat -->
    <div class="chat-view" id="chat-view" hidden>
      <div class="chat-header" id="chat-header">
        <button class="icon-btn back-btn" id="btn-back" title="Назад">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </button>
        <div class="chat-header-avatar" id="chat-avatar"></div>
        <div class="chat-header-info">
          <div class="chat-header-name" id="chat-partner-name"></div>
          <div class="chat-header-status" id="chat-partner-role"></div>
        </div>
      </div>

      <div class="messages-wrap" id="messages-wrap">
        <div class="messages-list" id="messages-list"></div>
        <div class="scroll-anchor" id="scroll-anchor"></div>
      </div>

      <div class="msg-input-bar">
        <textarea
          id="msg-input"
          class="msg-input"
          placeholder="Напишіть повідомлення..."
          rows="1"
          maxlength="4000"
        ></textarea>
        <button class="btn-send" id="btn-send" disabled title="Надіслати">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="20" height="20">
            <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M22 2L15 22 11 13 2 9l20-7z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>

  </main>
</div>

<!-- ════════════════════════════════════════════
     NEW CHAT MODAL
════════════════════════════════════════════ -->
<div id="new-chat-modal" class="modal-overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-label="Новий чат">
    <div class="modal-header">
      <h2 class="modal-title">Новий чат</h2>
      <button class="icon-btn modal-close" id="btn-close-modal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="modal-search">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input id="user-search-input" class="search-input" type="text"
             placeholder="Пошук за ім'ям, телефоном або рахунком..."
             autocomplete="off"/>
    </div>
    <div class="user-search-results" id="user-search-results">
      <p class="search-hint" id="search-hint">Введіть мінімум 2 символи</p>
    </div>
  </div>
</div>

<!-- ════════════════════════════════════════════
     TOAST
════════════════════════════════════════════ -->
<div id="toast" class="toast" aria-live="polite"></div>

<script src="/js/messenger.js"></script>
</body>
</html>
