      /* dvh = dynamic viewport height — on Android Chrome excludes the
         collapsible address bar, preventing layout jumps */
      html {
        height: 100%;
        min-height: 100%;

           prevents 34px home-indicator gap on cold launch.
           100dvh follows as the modern override for all other browsers. */
        min-height: -webkit-fill-available;
        min-height: 100dvh;
        overscroll-behavior: none;
        /* MUST match the bottom stop of appBg gradient (#07150f exactly).
           The old value #071510 was 1 blue-channel unit off — visible as a
           strip on OLED screens when the fixed overlay hasn't composited yet. */
        background: #07150f;
      }
      body {
        margin: 0;
        height: 100%;
        min-height: 100%;
        min-height: -webkit-fill-available;
        min-height: 100dvh;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        font-feature-settings: 'kern' 1, 'liga' 1;
        overscroll-behavior: none;
        overflow: hidden;
        /* Exact match with html and gradient bottom stop */
        background: #07150f;
        /* Prevent text size adjustment on orientation change */
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      #root {
        height: var(--app-vh, 100dvh);
        min-height: var(--app-vh, 100dvh);
        /* Isolate stacking context for backdrop-filter on Android */
        isolation: isolate;
        /* Anchor for position:absolute TabBar so bottom:0 tracks the REAL
           screen bottom (--app-vh), not the iOS PWA layout viewport which
           can be shorter than the screen by the bottom safe-area inset. */
        position: relative;
      }
      /* Custom scrollbar (Chrome/Android WebView) */
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(180,172,155,0.18); border-radius: 100px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(180,172,155,0.32); }
      /* Input / button reset */
      input, button, select, textarea {
        font-family: inherit;
        font-size: inherit;
        line-height: inherit;
        /* Prevent iOS/Android from styling these with system defaults */
        -webkit-appearance: none;
        appearance: none;
      }
      input[type="number"]  { -moz-appearance: textfield; }
      input[type="search"]  { -webkit-appearance: none; }
      input::-webkit-outer-spin-button,

      /* Autofill — dark background for Chrome/Android */

      }
      /* Selection */
      ::selection { background: rgba(201,169,100,0.25); color: #f4ebd0; }

      (function () {
        function isStandaloneMode() {
          try {
            var iosStandalone = window.navigator && window.navigator.standalone === true;

            return !!(iosStandalone || mediaStandalone);

        var root = document.documentElement;
        function setAppVh() {

          var vv = (window.visualViewport && window.visualViewport.height) ? Math.round(window.visualViewport.height) : 0;

            h = Math.max(ih || 0, ch || 0, vv || 0);

            h = vv || ih || ch;

          if (h > 0) root.style.setProperty('--app-vh', h + 'px');

        setAppVh();
        requestAnimationFrame(setAppVh);
        setTimeout(setAppVh, 120);
        setTimeout(setAppVh, 600);
        setTimeout(setAppVh, 1200);
        window.addEventListener('resize', setAppVh, { passive: true });
        if (window.visualViewport && window.visualViewport.addEventListener) {
