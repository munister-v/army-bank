name: Deploy Project Pages (army-bank)

on:
  push:
    branches:
      - main
    paths:
      - "marketing/munister-army-bank/**"
      - ".github/workflows/deploy-project-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: project-pages-army-bank
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact (marketing/munister-army-bank)
        uses: actions/upload-pages-artifact@v3
        with:
          path: marketing/munister-army-bank

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
