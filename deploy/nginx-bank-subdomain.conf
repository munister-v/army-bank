# bank.munister.com.ua → proxy to army-bank.onrender.com
#
# Встановлення:
#   sudo cp deploy/nginx-bank-subdomain.conf /etc/nginx/sites-available/bank.munister.com.ua
#   sudo ln -s /etc/nginx/sites-available/bank.munister.com.ua /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d bank.munister.com.ua   # отримати SSL
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name bank.munister.com.ua;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bank.munister.com.ua;

    # SSL (certbot заповнить автоматично після `certbot --nginx`)
    # ssl_certificate     /etc/letsencrypt/live/bank.munister.com.ua/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/bank.munister.com.ua/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Proxy → Render (всі запити, включно з /api/, /css/, /js/, /sw.js)
    location / {
        proxy_pass          https://army-bank.onrender.com;
        proxy_http_version  1.1;

        # Критично: Host = onrender, щоб Render знав який сайт обслуговувати
        proxy_set_header    Host               army-bank.onrender.com;
        proxy_set_header    X-Real-IP          $remote_addr;
        proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto  https;
        proxy_set_header    X-Forwarded-Host   bank.munister.com.ua;

        # WebSocket (для майбутніх push-з'єднань)
        proxy_set_header    Upgrade            $http_upgrade;
        proxy_set_header    Connection         "upgrade";

        proxy_redirect      off;
        proxy_buffering     off;

        # Таймаути (Render free tier може спати 50с при холодному старті)
        proxy_connect_timeout  70s;
        proxy_read_timeout     90s;
        proxy_send_timeout     90s;
    }

    # Статичні ресурси — кешуємо на клієнті
    location ~* \.(css|js|png|ico|woff2|webmanifest|json)$ {
        proxy_pass         https://army-bank.onrender.com;
        proxy_set_header   Host army-bank.onrender.com;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_redirect     off;
        proxy_buffering    on;
        proxy_cache_valid  200 1h;
        expires            1h;
        add_header         Cache-Control "public, max-age=3600";
    }
}
